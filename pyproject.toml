[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deer-agent-framework"
version = "0.2.4"
description = "DEER - Deterministic Executable Engine for Runtime-agents"
authors = [{ name = "Yeison Cardona" }]
license = { text = "BSD-2-Clause" }
classifiers = [
    #    "Development Status :: 1 - Planning",
    #    "Development Status :: 2 - Pre-Alpha",
    #    "Development Status :: 3 - Alpha",
    "Development Status :: 4 - Beta",
    #    "Development Status :: 5 - Production/Stable",
    #    "Development Status :: 6 - Mature",
    #    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "lxml>=6.1.3",
    "tomlkit>=0.15.1",
    "ruamel.yaml>=0.19.1",
    "libcst>=1.9.0",
    "chromadb>=1.5.9",
    "prompt_toolkit>=3.0.53",
]

[project.optional-dependencies]
debug = [
    "pytest>=9.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deer*"]

[project.scripts]
deer = "deer.cli.main:main"

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "R0801",
    "W0718",
    "W0212",
    "C0103", # Constant name "OperatingSystemAgent" doesn't conform to UPPER_CASE naming style (invalid-name)
    "C0301", # Line too long (110/100) (line-too-long)
    "C0302", # Too many lines in module (1014/1000) (too-many-lines)
    "C0114", # Missing module docstring (missing-module-docstring)
    "C0115", # Missing class docstring (missing-class-docstring)
    "C0116", # Missing function or method docstring (missing-function-docstring)
]

[tool.pylint.MAIN]
load-plugins = ["pylint_pydantic"]
