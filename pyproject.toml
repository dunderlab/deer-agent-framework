[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deer-agent-framework"
version = "0.1.0"
description = "DEER - Deterministic Executable Engine for Runtime-agents"
authors = [{ name = "Yeison" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "rich",
  "prompt_toolkit",
]

[project.optional-dependencies]
gemini = [
  "google-genai>=2.3.0"
]
ollama = [
  "ollama>=0.6.2"
]
debug = [
  "matplotlib>=3.10.9",
  "arize-phoenix-otel>=0.16.1",
  "python-dotenv>=1.2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deer*"]

 [project.scripts]
 deer = "deer.main:main"