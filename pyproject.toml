[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deer-agent-framework"
version = "0.0"
description = "DEER - Deterministic Executable Engine for Runtime-agents"
authors = [{ name = "Yeison" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "rich",
    "prompt_toolkit",
]

[project.optional-dependencies]
debug = [
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deer*"]

[project.scripts]
deer = "deer.main:main"