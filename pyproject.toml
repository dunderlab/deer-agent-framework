[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deer-agent-framework"
version = "0.1.0"
description = "DEER - Deterministic Executable Engine for Runtime-agents"
authors = [{ name = "Yeison" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=1.10,<2.0",
  "rich"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nomos*"]
