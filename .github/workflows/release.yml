name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml' # Only runs if this file changes

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: # IMPORTANT: Allows the workflow to write the tag and the release
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to handle tags correctly

      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          # Busca la línea que dice 'version = "X.Y.Z"' y extrae el valor entre comillas
          VERSION=$(grep 'version =' pyproject.toml | cut -d '"' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version found: $VERSION"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push Tag
        run: |
          # Crea el tag vX.Y.Z y lo sube al repo
          git tag v${{ env.VERSION }}
          git push origin v${{ env.VERSION }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Create a temporary file with your professional message
          cat <<EOF > release_intro.md
          # DEER: Deterministic Executable Engine for Runtime Agents

          ### **Stop building "Vibe-based" Agents. Start Engineering Deterministic Systems.**

          **DEER** is a professional-grade framework designed to transform LLMs from probabilistic text-generators into
          **Deterministic Autonomous Engineers**. While other frameworks rely on massive, fragile system prompts and hope for the
          best, DEER subordinates the LLM to a rigid, code-defined execution pipeline where every action is typed, validated, and
          physically verified.
          
          ---
          EOF
          
          # 2. Use --notes-file to load that message and --generate-notes to append the changelog below
          gh release create v${{ env.VERSION }} \
            --title "Deer v${{ env.VERSION }}" \
            --notes-file release_intro.md \
            --generate-notes
            --draft